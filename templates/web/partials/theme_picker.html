{{define "theme_picker"}}
<div class="theme-picker" data-mode="gallery">
    <div class="theme-picker-header">
        <h3>Select Theme</h3>
        <div class="theme-filter">
            <label for="theme-category-filter">Category:</label>
            <select id="theme-category-filter" class="theme-category-select">
                <option value="">All Themes</option>
                <option value="plain">Plain Text</option>
                <option value="card">Card Designs</option>
                <option value="modern">Modern</option>
                <option value="classic">Classic</option>
                <option value="fun">Fun</option>
            </select>
        </div>
    </div>
    
    <div id="theme-gallery-container" class="theme-gallery" role="region" aria-label="Theme gallery">
        {{range .Themes}}
        <div class="theme-card {{if eq .ID $.SelectedThemeID}}selected{{end}}" 
             data-theme-id="{{.ID}}"
             data-category="{{.Category}}"
             role="radio"
             aria-checked="{{if eq .ID $.SelectedThemeID}}true{{else}}false{{end}}"
             tabindex="{{if eq .ID $.SelectedThemeID}}0{{else}}-1{{end}}">
            
            <div class="theme-thumbnail">
                {{if .ThumbnailURL}}
                <img src="{{.ThumbnailURL}}" 
                     alt="{{.Name}} theme preview"
                     loading="lazy">
                {{else}}
                <img src="/static/images/themes/default-thumbnail.svg" 
                     alt="{{.Name}} theme preview"
                     loading="lazy">
                {{end}}
            </div>
            
            <div class="theme-info">
                <h4 class="theme-name">{{.Name}}</h4>
                <p class="theme-description">{{.Description}}</p>
                
                {{if .Tags}}
                <div class="theme-tags">
                    {{range .Tags}}
                    <span class="theme-tag">{{.}}</span>
                    {{end}}
                </div>
                {{end}}
            </div>
            
            <div class="theme-actions">
                <button type="button" 
                        class="btn-preview" 
                        data-theme-id="{{.ID}}"
                        aria-label="Preview {{.Name}} theme">
                    Preview
                </button>
                <button type="button" 
                        class="btn-select" 
                        data-theme-id="{{.ID}}"
                        aria-label="Select {{.Name}} theme">
                    Select
                </button>
            </div>
        </div>
        {{end}}
    </div>
    
    <div id="design-mode-container" class="design-mode-container" role="region" aria-label="Live preview" hidden aria-hidden="true">
        <div class="design-mode-header">
            <button 
                type="button" 
                id="gallery-mode-btn" 
                class="btn-back" 
                aria-label="Back to theme gallery">
                ← Back to Themes
            </button>
            
            <div class="form-group">
                <label for="design-theme-select">Theme:</label>
                <select id="design-theme-select" class="form-select">
                    {{range .Themes}}
                    <option value="{{.ID}}" {{if eq .ID $.SelectedThemeID}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </div>
            
            <div class="mobile-view-toggle" role="tablist" aria-label="Mobile view mode">
                <button 
                    type="button" 
                    id="mobile-edit-btn" 
                    class="view-btn" 
                    role="tab" 
                    aria-selected="true">
                    Edit
                </button>
                <button 
                    type="button" 
                    id="mobile-preview-btn" 
                    class="view-btn" 
                    role="tab" 
                    aria-selected="false">
                    Preview
                </button>
            </div>
        </div>
        
        <div class="live-preview-wrapper">
            <div class="live-preview-loading" role="status" aria-live="polite" hidden>
                <div class="spinner" aria-hidden="true"></div>
                <span>Loading preview...</span>
            </div>
            
            <div class="live-preview-error" role="alert" hidden>
                <p>Unable to load preview</p>
                <button type="button" class="btn-retry-preview">Retry</button>
            </div>
            
            <iframe 
                id="live-preview-frame" 
                class="live-preview-frame" 
                title="Live preview of invitation theme"
                sandbox="allow-same-origin allow-scripts"
                aria-live="polite"
                src="about:blank">
            </iframe>
        </div>
    </div>
    
    <input type="hidden" id="selected-theme-id" name="template_id" value="{{.SelectedThemeID}}">
    <!-- Hidden button to keep code compatible, but won't be visible -->
    <button type="button" id="design-mode-btn" style="display: none;" aria-hidden="true"></button>
</div>
{{end}}
