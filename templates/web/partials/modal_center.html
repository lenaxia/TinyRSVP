{{define "modal_center"}}
<!-- Center Modal Template
Usage:
{{template "modal_center" dict "ID" "myModal" "Title" "Modal Title" "Size" "md" "Content" .ModalContent}}

Sizes: sm (400px), md (600px), lg (800px), xl (1000px), full (95vw x 95vh)
-->
<div id="{{.ID}}" class="modal-container">
    <div class="modal-overlay" aria-hidden="true"></div>
    <div class="modal-center modal-{{.Size | default "md"}}" role="dialog" aria-modal="true" aria-labelledby="{{.ID}}-title" aria-hidden="true">
        <div class="modal-header">
            <h2 class="modal-title" id="{{.ID}}-title">{{.Title}}</h2>
            <button type="button" class="modal-close" data-modal-close aria-label="Close modal">×</button>
        </div>
        <div class="modal-body{{if .CompactBody}} modal-body-compact{{end}}">
            {{.Content}}
        </div>
        {{if .Footer}}
        <div class="modal-footer{{if .FooterAlign}} modal-footer-{{.FooterAlign}}{{end}}">
            {{.Footer}}
        </div>
        {{end}}
    </div>
</div>
{{end}}
