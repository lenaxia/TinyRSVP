{{define "component_overlay"}}
{{with .Content.Overlay}}
<div id="{{$.ID}}"
     class="component-overlay component-{{$.Position.Mode}}{{if $.ClassName}} {{$.ClassName}}{{end}}"
     style="
        {{if $.Visible}}display: block;{{else}}display: none;{{end}}
        {{if eq $.Position.Mode "absolute"}}
            position: absolute;
            {{if $.Position.X}}left: {{$.Position.X}};{{end}}
            {{if $.Position.Y}}top: {{$.Position.Y}};{{end}}
        {{end}}
        width: {{$.Dimensions.Width}};
        height: {{$.Dimensions.Height}};
        z-index: {{$.ZIndex}};
        {{if .BackgroundColor}}background-color: {{.BackgroundColor}};{{end}}
        {{if .BackgroundImage}}background-image: {{.BackgroundImage}};{{end}}
        {{if .BackgroundSize}}background-size: {{.BackgroundSize}};{{end}}
        {{if .BorderRadius}}border-radius: {{.BorderRadius}};{{end}}
        {{if .Border}}border: {{.Border}};{{end}}
        {{if .BoxShadow}}box-shadow: {{.BoxShadow}};{{end}}
        {{if .ClipPath}}clip-path: {{.ClipPath}};{{end}}
     ">
    {{if .Placeholder}}
        <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #999;">
            Placeholder
        </div>
    {{end}}
</div>
{{end}}
{{end}}
