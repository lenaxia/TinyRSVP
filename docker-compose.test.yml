# TinyRSVP Test Environment
# Complete stack with mock SMTP, OIDC, and reverse proxy for testing
# Usage: docker-compose -f docker-compose.test.yml up
#
# ⚠️  SAFE TO COMMIT - TEST ENVIRONMENT ONLY
# All secrets in this file are intentionally public and only work locally.
# See test/SECURITY_NOTICE.md for details.

services:
  # ============================================================================
  # TinyRSVP Application
  # ============================================================================
  tinyrsvp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinyrsvp-tinyrsvp
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_BASE_URL=http://localhost:8080
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/data/tinyrsvp.db
      
      # Token Secret (REQUIRED - must persist across restarts)
      - TOKEN_SECRET=da8f152a3cc3d58054cb988a463344503ad1ad09fba718a8a5e6e9513d16040f
      
      # SMTP Configuration (MailHog)
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - EMAIL_FROM=noreply@tinyrsvp.test
      - EMAIL_FROM_NAME=TinyRSVP Test
      
      # Forward Auth Configuration (simpler for testing)
      - AUTH_MODE=forward_auth
      - OIDC_ENABLED=false
      - FORWARD_AUTH_ENABLED=true
      - FORWARD_AUTH_USER_HEADER=X-Forwarded-User
      - FORWARD_AUTH_EMAIL_HEADER=X-Forwarded-Email
      - FORWARD_AUTH_TRUSTED_IPS=127.0.0.1,::1,172.18.0.1,172.18.0.2,172.18.0.3,172.18.0.4,172.18.0.5,172.18.0.6,172.21.0.1,172.21.0.2,172.21.0.3,172.21.0.4,172.21.0.5,172.21.0.6
      
      # Storage
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/data/uploads
      
      # Development/Testing
      - LOG_LEVEL=debug
      - ENVIRONMENT=test
    volumes:
      - tinyrsvp-test-data:/data
    networks:
      - tinyrsvp-test
    depends_on:
      - mailhog
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================================
  # MailHog - Mock SMTP Server with Web UI
  # ============================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog-test
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - tinyrsvp-test
    environment:
      - MH_STORAGE=maildir
      - MH_MAILDIR_PATH=/maildir
    volumes:
      - mailhog-data:/maildir
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Authelia - Lightweight OIDC Provider
  # ============================================================================
  authelia:
    image: authelia/authelia:latest
    container_name: authelia-test
    ports:
      - "9091:9091"  # Authelia web UI
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./test/authelia/configuration.yml:/config/configuration.yml:ro
      - ./test/authelia/users_database.yml:/config/users_database.yml:ro
      - ./test/authelia/certs:/config/certs:ro
      - authelia-data:/config
    networks:
      - tinyrsvp-test
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Traefik - Reverse Proxy (Optional, for advanced testing)
  # ============================================================================
  traefik:
    image: traefik:v2.10
    container_name: traefik-test
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --log.level=DEBUG
    ports:
      - "8081:80"      # HTTP with basic auth
      - "8082:8080"    # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./test/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks:
      - tinyrsvp-test
    depends_on:
      - tinyrsvp
    labels:
      - "traefik.enable=true"

  # ============================================================================
  # Browserless - Headless Chrome for Browser Testing
  # ============================================================================
  browserless:
    image: browserless/chrome:latest
    container_name: browserless-chrome
    ports:
      - "3000:3000"   # Browserless HTTP API
      - "9222:9222"   # Chrome Remote Debugging Protocol
    environment:
      # Enable remote debugging
      - DEBUG=browserless*
      - ENABLE_DEBUGGER=true
      - CHROME_REFRESH_TIME=0
      
      # Connection settings
      - CONNECTION_TIMEOUT=60000
      - MAX_CONCURRENT_SESSIONS=10
      - QUEUE_LENGTH=10
      
      # Chrome flags for remote debugging
      - PREBOOT_CHROME=true
      - KEEP_ALIVE=true
      - DEFAULT_LAUNCH_ARGS=["--remote-debugging-address=0.0.0.0","--remote-debugging-port=9222","--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage","--disable-gpu"]
      
      # Security (adjust for your needs)
      - TOKEN=
      - CORS=true
      
      # Resource limits
      - MAX_CPU_PERCENT=99
      - MAX_MEMORY_PERCENT=99
      
    shm_size: 2gb
    
    networks:
      - tinyrsvp-test
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/pressure"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    restart: unless-stopped

networks:
  tinyrsvp-test:
    driver: bridge

volumes:
  tinyrsvp-test-data:
    driver: local
  mailhog-data:
    driver: local
  authelia-data:
    driver: local
