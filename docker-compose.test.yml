# TinyRSVP Test Environment
# Complete stack with mock SMTP, OIDC, and reverse proxy for testing
# Usage: docker-compose -f docker-compose.test.yml up

version: '3.8'

services:
  # ============================================================================
  # TinyRSVP Application
  # ============================================================================
  tinyrsvp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinyrsvp-test
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_BASE_URL=http://localhost:8080
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/data/tinyrsvp.db
      
      # SMTP Configuration (MailHog)
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - SMTP_FROM=noreply@tinyrsvp.test
      - EMAIL_FROM=noreply@tinyrsvp.test
      
      # OIDC Configuration (Authelia)
      - AUTH_MODE=oidc
      - OIDC_ISSUER_URL=http://authelia:9091
      - OIDC_CLIENT_ID=tinyrsvp
      - OIDC_CLIENT_SECRET=insecure_secret_for_testing_only
      - OIDC_REDIRECT_URL=http://localhost:8080/auth/callback
      
      # Storage
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/data/uploads
      
      # Development/Testing
      - LOG_LEVEL=debug
      - ENVIRONMENT=test
    volumes:
      - tinyrsvp-test-data:/data
    networks:
      - tinyrsvp-test
    depends_on:
      - mailhog
      - authelia
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================================
  # MailHog - Mock SMTP Server with Web UI
  # ============================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog-test
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - tinyrsvp-test
    environment:
      - MH_STORAGE=maildir
      - MH_MAILDIR_PATH=/maildir
    volumes:
      - mailhog-data:/maildir
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Authelia - Lightweight OIDC Provider
  # ============================================================================
  authelia:
    image: authelia/authelia:latest
    container_name: authelia-test
    ports:
      - "9091:9091"  # Authelia web UI
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - ./test/authelia/configuration.yml:/config/configuration.yml:ro
      - ./test/authelia/users_database.yml:/config/users_database.yml:ro
      - authelia-data:/config
    networks:
      - tinyrsvp-test
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Traefik - Reverse Proxy (Optional, for advanced testing)
  # ============================================================================
  traefik:
    image: traefik:v2.10
    container_name: traefik-test
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=DEBUG
    ports:
      - "80:80"      # HTTP
      - "8082:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - tinyrsvp-test
    labels:
      - "traefik.enable=true"

networks:
  tinyrsvp-test:
    driver: bridge

volumes:
  tinyrsvp-test-data:
    driver: local
  mailhog-data:
    driver: local
  authelia-data:
    driver: local
