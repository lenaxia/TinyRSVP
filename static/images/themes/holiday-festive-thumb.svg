<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="holidayThumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="200" fill="#fef8f8"/>
  <rect width="300" height="200" fill="url(#holidayThumbGrad)"/>
  
  <!-- Snowflakes -->
  <g opacity="0.4">
    <g transform="translate(40, 30)">
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="-7" y1="7" x2="7" y2="-7" stroke="#dc2626" stroke-width="1.5"/>
    </g>
    
    <g transform="translate(260, 40)">
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#16a34a" stroke-width="1.5"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#16a34a" stroke-width="1.5"/>
      <line x1="-7" y1="-7" x2="7" y2="7" stroke="#16a34a" stroke-width="1.5"/>
      <line x1="-7" y1="7" x2="7" y2="-7" stroke="#16a34a" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Ornaments -->
  <circle cx="40" cy="160" r="12" fill="#dc2626" opacity="0.5"/>
  <rect x="36" y="148" width="8" height="5" fill="#d4af37" opacity="0.6"/>
  
  <circle cx="260" cy="170" r="13" fill="#16a34a" opacity="0.5"/>
  <rect x="256" y="157" width="8" height="5" fill="#d4af37" opacity="0.6"/>
  
  <!-- Card -->
  <rect x="60" y="75" width="180" height="75" fill="white" opacity="0.95" rx="6" stroke="#dc2626" stroke-width="2"/>
  <text x="150" y="105" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#dc2626" text-anchor="middle">Holiday</text>
  <text x="150" y="125" font-family="Georgia, serif" font-size="11" fill="#16a34a" text-anchor="middle">Festive</text>
</svg>
