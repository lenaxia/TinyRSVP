<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="corpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="400" fill="#f8fafc"/>
  <rect width="1200" height="400" fill="url(#corpGrad)"/>
  
  <!-- Geometric shapes - modern abstract -->
  <rect x="50" y="50" width="150" height="150" fill="#2563eb" opacity="0.1" transform="rotate(15 125 125)"/>
  <rect x="1000" y="200" width="120" height="120" fill="#0ea5e9" opacity="0.1" transform="rotate(-15 1060 260)"/>
  
  <!-- Diagonal lines pattern -->
  <g opacity="0.08">
    <line x1="0" y1="100" x2="300" y2="0" stroke="#2563eb" stroke-width="40"/>
    <line x1="200" y1="400" x2="500" y2="0" stroke="#64748b" stroke-width="40"/>
    <line x1="700" y1="400" x2="1000" y2="0" stroke="#0ea5e9" stroke-width="40"/>
    <line x1="900" y1="400" x2="1200" y2="100" stroke="#2563eb" stroke-width="40"/>
  </g>
  
  <!-- Modern geometric accents -->
  <circle cx="200" cy="200" r="60" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.3"/>
  <circle cx="1000" cy="200" r="70" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.3"/>
  
  <!-- Horizontal accent lines -->
  <line x1="0" y1="150" x2="400" y2="150" stroke="#2563eb" stroke-width="2" opacity="0.4"/>
  <line x1="800" y1="250" x2="1200" y2="250" stroke="#0ea5e9" stroke-width="2" opacity="0.4"/>
  
  <!-- Small geometric details -->
  <rect x="350" y="80" width="30" height="30" fill="#64748b" opacity="0.2"/>
  <rect x="820" y="120" width="25" height="25" fill="#2563eb" opacity="0.2" transform="rotate(45 832.5 132.5)"/>
</svg>
