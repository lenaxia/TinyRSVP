<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="birthdayThumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#ffd93d;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#6bcf7f;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="200" fill="#fffbf0"/>
  <rect width="300" height="200" fill="url(#birthdayThumbGrad)"/>
  
  <!-- Balloons -->
  <ellipse cx="40" cy="40" rx="18" ry="24" fill="#ff6b9d" opacity="0.7"/>
  <line x1="40" y1="64" x2="40" y2="90" stroke="#ff6b9d" stroke-width="1.5"/>
  
  <ellipse cx="75" cy="30" rx="20" ry="26" fill="#ffd93d" opacity="0.7"/>
  <line x1="75" y1="56" x2="75" y2="90" stroke="#ffd93d" stroke-width="1.5"/>
  
  <ellipse cx="260" cy="35" rx="19" ry="25" fill="#6bcf7f" opacity="0.7"/>
  <line x1="260" y1="60" x2="260" y2="90" stroke="#6bcf7f" stroke-width="1.5"/>
  
  <!-- Confetti -->
  <g opacity="0.6">
    <rect x="120" y="20" width="5" height="5" fill="#ff6b9d" transform="rotate(15 122.5 22.5)"/>
    <rect x="180" y="25" width="5" height="5" fill="#ffd93d" transform="rotate(45 182.5 27.5)"/>
    <circle cx="220" cy="30" r="3" fill="#6bcf7f"/>
  </g>
  
  <!-- Card -->
  <rect x="50" y="100" width="200" height="70" fill="white" opacity="0.9" rx="8" stroke="#ff6b9d" stroke-width="2"/>
  <text x="150" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ff6b9d" text-anchor="middle">Birthday</text>
  <text x="150" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Celebration</text>
</svg>
