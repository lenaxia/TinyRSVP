<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modernGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="400" fill="#ffffff"/>
  <rect width="1200" height="400" fill="url(#modernGrad)"/>
  
  <!-- Minimalist geometric shapes -->
  <rect x="100" y="100" width="200" height="200" fill="none" stroke="#0f172a" stroke-width="2" opacity="0.15"/>
  <rect x="900" y="100" width="200" height="200" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.15"/>
  
  <!-- Circles -->
  <circle cx="200" cy="200" r="80" fill="none" stroke="#64748b" stroke-width="1" opacity="0.2"/>
  <circle cx="1000" cy="200" r="80" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>
  
  <!-- Diagonal accent line -->
  <line x1="0" y1="0" x2="400" y2="400" stroke="#06b6d4" stroke-width="3" opacity="0.1"/>
  <line x1="800" y1="0" x2="1200" y2="400" stroke="#0f172a" stroke-width="3" opacity="0.1"/>
  
  <!-- Horizontal lines -->
  <line x1="0" y1="150" x2="350" y2="150" stroke="#64748b" stroke-width="1" opacity="0.2"/>
  <line x1="850" y1="250" x2="1200" y2="250" stroke="#64748b" stroke-width="1" opacity="0.2"/>
  
  <!-- Small accent squares -->
  <rect x="450" y="100" width="40" height="40" fill="#06b6d4" opacity="0.1"/>
  <rect x="710" y="260" width="40" height="40" fill="#0f172a" opacity="0.1"/>
  
  <!-- Dots pattern -->
  <g opacity="0.15">
    <circle cx="500" cy="80" r="4" fill="#64748b"/>
    <circle cx="520" cy="80" r="4" fill="#64748b"/>
    <circle cx="540" cy="80" r="4" fill="#64748b"/>
    
    <circle cx="660" cy="320" r="4" fill="#06b6d4"/>
    <circle cx="680" cy="320" r="4" fill="#06b6d4"/>
    <circle cx="700" cy="320" r="4" fill="#06b6d4"/>
  </g>
</svg>
