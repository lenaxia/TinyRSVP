<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="corpThumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="200" fill="#f8fafc"/>
  <rect width="300" height="200" fill="url(#corpThumbGrad)"/>
  
  <!-- Geometric shapes -->
  <rect x="20" y="20" width="60" height="60" fill="#2563eb" opacity="0.15" transform="rotate(15 50 50)"/>
  <rect x="220" y="120" width="50" height="50" fill="#0ea5e9" opacity="0.15" transform="rotate(-15 245 145)"/>
  
  <!-- Diagonal accent -->
  <line x1="0" y1="50" x2="100" y2="0" stroke="#2563eb" stroke-width="15" opacity="0.1"/>
  <line x1="200" y1="200" x2="300" y2="150" stroke="#0ea5e9" stroke-width="15" opacity="0.1"/>
  
  <!-- Card -->
  <rect x="60" y="70" width="180" height="80" fill="white" opacity="0.95" rx="6" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">Corporate</text>
  <text x="150" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Professional</text>
</svg>
