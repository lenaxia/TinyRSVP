<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gardenThumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#84cc16;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="200" fill="#f7fef7"/>
  <rect width="300" height="200" fill="url(#gardenThumbGrad)"/>
  
  <!-- Leaves -->
  <g opacity="0.4">
    <ellipse cx="30" cy="40" rx="20" ry="10" fill="#16a34a" transform="rotate(-30 30 40)"/>
    <ellipse cx="45" cy="55" rx="22" ry="11" fill="#84cc16" transform="rotate(-45 45 55)"/>
    
    <ellipse cx="270" cy="45" rx="20" ry="10" fill="#16a34a" transform="rotate(30 270 45)"/>
    <ellipse cx="255" cy="60" rx="22" ry="11" fill="#84cc16" transform="rotate(45 255 60)"/>
  </g>
  
  <!-- Flowers -->
  <g opacity="0.5">
    <circle cx="40" cy="150" r="8" fill="#fbbf24"/>
    <circle cx="37" cy="147" r="3" fill="#84cc16"/>
    <circle cx="43" cy="147" r="3" fill="#84cc16"/>
    <circle cx="37" cy="153" r="3" fill="#84cc16"/>
    <circle cx="43" cy="153" r="3" fill="#84cc16"/>
    
    <circle cx="260" cy="160" r="8" fill="#fbbf24"/>
    <circle cx="257" cy="157" r="3" fill="#16a34a"/>
    <circle cx="263" cy="157" r="3" fill="#16a34a"/>
    <circle cx="257" cy="163" r="3" fill="#16a34a"/>
    <circle cx="263" cy="163" r="3" fill="#16a34a"/>
  </g>
  
  <!-- Card -->
  <rect x="60" y="75" width="180" height="75" fill="white" opacity="0.95" rx="6" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="105" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#16a34a" text-anchor="middle">Garden</text>
  <text x="150" y="125" font-family="Georgia, serif" font-size="11" fill="#84cc16" text-anchor="middle">Party</text>
</svg>
