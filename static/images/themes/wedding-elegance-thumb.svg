<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="weddingThumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c2c2;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="200" fill="#fef5f5"/>
  <rect width="300" height="200" fill="url(#weddingThumbGrad)"/>
  
  <!-- Floral elements -->
  <circle cx="30" cy="30" r="20" fill="#f4c2c2" opacity="0.5"/>
  <circle cx="270" cy="170" r="22" fill="#d4af37" opacity="0.5"/>
  <circle cx="25" cy="175" r="18" fill="#8b4789" opacity="0.4"/>
  
  <!-- Card representation -->
  <rect x="50" y="60" width="200" height="80" fill="white" opacity="0.9" rx="8" stroke="#d4af37" stroke-width="2"/>
  <text x="150" y="95" font-family="Georgia, serif" font-size="16" font-weight="600" fill="#8b4789" text-anchor="middle">Wedding</text>
  <text x="150" y="115" font-family="Georgia, serif" font-size="12" fill="#6b7280" text-anchor="middle">Elegance</text>
</svg>
