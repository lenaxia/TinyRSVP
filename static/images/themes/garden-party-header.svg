<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gardenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#84cc16;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="400" fill="#f7fef7"/>
  <rect width="1200" height="400" fill="url(#gardenGrad)"/>
  
  <!-- Leaves and botanical elements -->
  <g opacity="0.4">
    <!-- Left side foliage -->
    <ellipse cx="80" cy="100" rx="40" ry="20" fill="#16a34a" transform="rotate(-30 80 100)"/>
    <ellipse cx="120" cy="130" rx="45" ry="22" fill="#84cc16" transform="rotate(-45 120 130)"/>
    <ellipse cx="60" cy="160" rx="38" ry="20" fill="#16a34a" transform="rotate(-60 60 160)"/>
    <ellipse cx="100" cy="190" rx="42" ry="21" fill="#84cc16" transform="rotate(-20 100 190)"/>
    
    <!-- Right side foliage -->
    <ellipse cx="1120" cy="110" rx="40" ry="20" fill="#16a34a" transform="rotate(30 1120 110)"/>
    <ellipse cx="1080" cy="140" rx="45" ry="22" fill="#84cc16" transform="rotate(45 1080 140)"/>
    <ellipse cx="1140" cy="170" rx="38" ry="20" fill="#16a34a" transform="rotate(60 1140 170)"/>
    <ellipse cx="1100" cy="200" rx="42" ry="21" fill="#84cc16" transform="rotate(20 1100 200)"/>
  </g>
  
  <!-- Flowers -->
  <g opacity="0.5">
    <!-- Left flowers -->
    <circle cx="150" cy="280" r="15" fill="#fbbf24"/>
    <circle cx="145" cy="275" r="6" fill="#84cc16"/>
    <circle cx="155" cy="275" r="6" fill="#84cc16"/>
    <circle cx="145" cy="285" r="6" fill="#84cc16"/>
    <circle cx="155" cy="285" r="6" fill="#84cc16"/>
    
    <circle cx="250" cy="300" r="14" fill="#fbbf24"/>
    <circle cx="246" cy="296" r="5" fill="#16a34a"/>
    <circle cx="254" cy="296" r="5" fill="#16a34a"/>
    <circle cx="246" cy="304" r="5" fill="#16a34a"/>
    <circle cx="254" cy="304" r="5" fill="#16a34a"/>
    
    <!-- Right flowers -->
    <circle cx="950" cy="290" r="15" fill="#fbbf24"/>
    <circle cx="945" cy="285" r="6" fill="#84cc16"/>
    <circle cx="955" cy="285" r="6" fill="#84cc16"/>
    <circle cx="945" cy="295" r="6" fill="#84cc16"/>
    <circle cx="955" cy="295" r="6" fill="#84cc16"/>
    
    <circle cx="1050" cy="310" r="14" fill="#fbbf24"/>
    <circle cx="1046" cy="306" r="5" fill="#16a34a"/>
    <circle cx="1054" cy="306" r="5" fill="#16a34a"/>
    <circle cx="1046" cy="314" r="5" fill="#16a34a"/>
    <circle cx="1054" cy="314" r="5" fill="#16a34a"/>
  </g>
  
  <!-- Vines -->
  <path d="M 0 250 Q 150 230 300 250 T 600 250 T 900 250 T 1200 250" stroke="#16a34a" stroke-width="3" fill="none" opacity="0.3"/>
  
  <!-- Small leaves on vine -->
  <g opacity="0.3">
    <ellipse cx="150" cy="240" rx="15" ry="8" fill="#84cc16" transform="rotate(-30 150 240)"/>
    <ellipse cx="450" cy="240" rx="15" ry="8" fill="#84cc16" transform="rotate(30 450 240)"/>
    <ellipse cx="750" cy="240" rx="15" ry="8" fill="#84cc16" transform="rotate(-30 750 240)"/>
    <ellipse cx="1050" cy="240" rx="15" ry="8" fill="#84cc16" transform="rotate(30 1050 240)"/>
  </g>
  
  <!-- Grass texture at bottom -->
  <g opacity="0.2">
    <line x1="0" y1="380" x2="0" y2="400" stroke="#16a34a" stroke-width="2"/>
    <line x1="20" y1="385" x2="20" y2="400" stroke="#84cc16" stroke-width="2"/>
    <line x1="40" y1="382" x2="40" y2="400" stroke="#16a34a" stroke-width="2"/>
    <line x1="60" y1="387" x2="60" y2="400" stroke="#84cc16" stroke-width="2"/>
    <line x1="80" y1="383" x2="80" y2="400" stroke="#16a34a" stroke-width="2"/>
  </g>
</svg>
