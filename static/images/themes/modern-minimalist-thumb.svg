<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modernThumbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="200" fill="#ffffff"/>
  <rect width="300" height="200" fill="url(#modernThumbGrad)"/>
  
  <!-- Geometric shapes -->
  <rect x="30" y="30" width="80" height="80" fill="none" stroke="#0f172a" stroke-width="1.5" opacity="0.15"/>
  <rect x="190" y="90" width="80" height="80" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.15"/>
  
  <!-- Circles -->
  <circle cx="70" cy="70" r="30" fill="none" stroke="#64748b" stroke-width="1" opacity="0.2"/>
  <circle cx="230" cy="130" r="30" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>
  
  <!-- Diagonal line -->
  <line x1="0" y1="0" x2="120" y2="120" stroke="#06b6d4" stroke-width="2" opacity="0.1"/>
  
  <!-- Card -->
  <rect x="60" y="75" width="180" height="75" fill="white" opacity="0.95" rx="4" stroke="#0f172a" stroke-width="2"/>
  <text x="150" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Modern</text>
  <text x="150" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Minimalist</text>
</svg>
