<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="weddingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4c2c2;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="400" fill="#fef5f5"/>
  <rect width="1200" height="400" fill="url(#weddingGrad)"/>
  
  <!-- Floral decorative elements -->
  <circle cx="100" cy="100" r="40" fill="#f4c2c2" opacity="0.4"/>
  <circle cx="120" cy="120" r="30" fill="#d4af37" opacity="0.3"/>
  <circle cx="80" cy="130" r="25" fill="#8b4789" opacity="0.3"/>
  
  <circle cx="1100" cy="300" r="45" fill="#f4c2c2" opacity="0.4"/>
  <circle cx="1080" cy="280" r="35" fill="#d4af37" opacity="0.3"/>
  <circle cx="1120" cy="270" r="28" fill="#8b4789" opacity="0.3"/>
  
  <!-- Floral border pattern -->
  <g opacity="0.5">
    <circle cx="200" cy="50" r="15" fill="#f4c2c2"/>
    <circle cx="400" cy="40" r="18" fill="#d4af37"/>
    <circle cx="600" cy="45" r="16" fill="#8b4789"/>
    <circle cx="800" cy="50" r="17" fill="#f4c2c2"/>
    <circle cx="1000" cy="40" r="15" fill="#d4af37"/>
    
    <circle cx="200" cy="350" r="15" fill="#8b4789"/>
    <circle cx="400" cy="360" r="18" fill="#f4c2c2"/>
    <circle cx="600" cy="355" r="16" fill="#d4af37"/>
    <circle cx="800" cy="350" r="17" fill="#8b4789"/>
    <circle cx="1000" cy="360" r="15" fill="#f4c2c2"/>
  </g>
  
  <!-- Elegant curves -->
  <path d="M 0 200 Q 300 150 600 200 T 1200 200" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 0 220 Q 300 270 600 220 T 1200 220" stroke="#f4c2c2" stroke-width="2" fill="none" opacity="0.4"/>
</svg>
