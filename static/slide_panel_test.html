<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Panel Test</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/slide_panel.css">
    <link rel="stylesheet" href="/static/css/rsvp_settings.css">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 2rem;
            background: var(--color-background, #f5f5f5);
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Slide Panel Component Test</h1>
        <p>Click the button below to test the RSVP settings panel:</p>
        
        <button
            type="button"
            class="rsvp-settings-trigger-btn"
            data-rsvp-settings-trigger
            aria-label="Open RSVP settings"
        >
            <span class="rsvp-settings-trigger-icon">⚙️</span>
            <span class="rsvp-settings-trigger-text">Configure RSVP Settings</span>
        </button>
    </div>

    <!-- RSVP Settings Panel -->
    <div class="rsvp-settings-overlay"></div>
    <div class="rsvp-settings-panel">
        <div class="rsvp-settings-header">
            <h2 class="rsvp-settings-title">RSVP Settings</h2>
            <button class="rsvp-settings-close" aria-label="Close RSVP settings">×</button>
        </div>
        <div class="rsvp-settings-body">
            <p class="rsvp-settings-description">Configure how guests can respond to your event invitation.</p>

            <div class="rsvp-settings-section">
                <h3 class="rsvp-settings-section-title">RSVP Deadline</h3>
                
                <div class="form-group">
                    <label class="form-checkbox-label">
                        <input type="checkbox" id="has_rsvp_deadline" class="form-checkbox">
                        <span>Set a reply-by date</span>
                    </label>
                </div>

                <div class="form-group rsvp-deadline-fields" style="display: none;">
                    <label for="rsvp_deadline_input" class="form-label">Reply-by Date & Time</label>
                    <input type="hidden" id="rsvp_deadline_input" name="rsvp_deadline">
                </div>

                <div class="form-group rsvp-deadline-fields" style="display: none;">
                    <label class="form-checkbox-label">
                        <input type="checkbox" id="allow_rsvp_after_deadline" class="form-checkbox">
                        <span>Allow guests to RSVP after the deadline</span>
                    </label>
                </div>
            </div>

            <div class="rsvp-settings-section">
                <h3 class="rsvp-settings-section-title">Response Options</h3>
                
                <div class="form-group">
                    <label class="form-checkbox-label">
                        <input type="checkbox" id="allow_maybe_rsvp" class="form-checkbox" checked>
                        <span>Allow "Maybe" RSVPs</span>
                    </label>
                </div>
            </div>

            <div class="rsvp-settings-section">
                <h3 class="rsvp-settings-section-title">Guest List Privacy</h3>
                
                <div class="form-group">
                    <label class="form-checkbox-label">
                        <input type="checkbox" id="private_guest_list" class="form-checkbox">
                        <span>Private guest list</span>
                    </label>
                </div>
            </div>

            <div class="rsvp-settings-section">
                <h3 class="rsvp-settings-section-title">Plus Ones</h3>
                
                <div class="form-group">
                    <label for="max_plus_ones_input" class="form-label">Maximum plus ones per guest</label>
                    <select id="max_plus_ones_input" name="max_plus_ones" class="form-select">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
            </div>

            <div class="rsvp-settings-section">
                <h3 class="rsvp-settings-section-title">Headcount Details</h3>
                
                <div class="form-group">
                    <label class="form-checkbox-label">
                        <input type="checkbox" id="family_headcount" class="form-checkbox">
                        <span>Track adults & kids separately</span>
                    </label>
                </div>
            </div>

            <div class="rsvp-settings-section">
                <h3 class="rsvp-settings-section-title">Event Capacity</h3>
                
                <div class="form-group">
                    <label class="form-checkbox-label">
                        <input type="checkbox" id="has_event_capacity" class="form-checkbox">
                        <span>Set an event capacity</span>
                    </label>
                </div>

                <div class="form-group event-capacity-fields" style="display: none;">
                    <label for="event_capacity_input" class="form-label">Maximum Guests</label>
                    <input type="number" id="event_capacity_input" class="form-input" min="1" placeholder="e.g., 50">
                </div>
            </div>
        </div>
        <div class="rsvp-settings-footer">
            <button type="button" class="btn btn-secondary rsvp-settings-cancel">Cancel</button>
            <button type="button" class="btn btn-primary rsvp-settings-save">Save Settings</button>
        </div>
    </div>

    <script src="/static/js/slide_panel.js"></script>
    <script src="/static/js/rsvp_settings.js"></script>
</body>
</html>
