---
###############################################################################
#                   Authelia Test Configuration                              #
###############################################################################

theme: light
default_2fa_method: ""

server:
  host: 0.0.0.0
  port: 9091
  path: ""
  enable_pprof: false
  enable_expvars: false
  disable_healthcheck: false
  tls:
    key: ""
    certificate: ""

log:
  level: debug
  format: text
  file_path: ""
  keep_stdout: true

totp:
  disable: true
  issuer: tinyrsvp.test
  algorithm: sha1
  digits: 6
  period: 30
  skew: 1
  secret_size: 32

webauthn:
  disable: true

duo_api:
  disable: true

authentication_backend:
  password_reset:
    disable: true
  refresh_interval: 5m
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 1
      key_length: 32
      salt_length: 16
      memory: 64
      parallelism: 2

access_control:
  default_policy: bypass
  rules: []

session:
  name: authelia_session
  domain: localhost
  same_site: lax
  secret: insecure_session_secret_for_testing_only
  expiration: 1h
  inactivity: 5m
  remember_me_duration: 1M

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: insecure_encryption_key_for_testing_only_must_be_32_chars!!
  local:
    path: /config/db.sqlite3

notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt

identity_providers:
  oidc:
    hmac_secret: insecure_hmac_secret_for_testing_only_must_be_very_long_string
    issuer_private_key: |
